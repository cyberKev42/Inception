
services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    restart: unless-stopped
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    restart: unless-stopped
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_PASSWORD=${WP_USER_PASSWORD}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    depends_on:
      - mariadb

  nginx:
    build:
      context: ./requirements/nginx
      args:
        - CERT_COUNTRY=${CERT_COUNTRY}
        - CERT_STATE=${CERT_STATE}
        - CERT_LOCALITY=${CERT_LOCALITY}
        - CERT_ORG=${CERT_ORG}
        - CERT_OU=${CERT_OU}
        - CERT_CN=${CERT_CN}
    image: nginx
    restart: unless-stopped
    networks:
      - inception
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    depends_on:
      - wordpress

networks:
  inception:
    name: inception
    driver: bridge

volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      device: /home/kbrauer/data/wordpress
      o: bind
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      device: /home/kbrauer/data/mariadb
      o: bind
